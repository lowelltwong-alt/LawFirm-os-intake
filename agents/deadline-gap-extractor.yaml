worker_id: deadline-gap-extractor
version: "0.1"
purpose: Identify date/deadline candidates, urgency signals, and missing intake information.
model_class: deterministic_transform_plus_small_local_extractor
prompt_ref: deadline-gap-extractor
raw_source_access: structured_segments_only
cross_matter_access: false
network_access: false
write_scope: none
allowed_tools: []
input_schema_ref: schemas/segment.schema.json
output_schema_ref: schemas/intake-preflight-packet.schema.json
human_gate_required: true
revocation_owner: LawFirm-os-skills-registry
requirements:
  - every date is a candidate requiring verification
  - relative deadlines remain unresolved without a confirmed trigger date
prohibited:
  - docketing
  - legal conclusion that a date controls

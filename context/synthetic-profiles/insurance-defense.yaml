# Budget template uses the UTBMS litigation code set (L-codes for fees, E-codes for
# expenses) as external_code_candidate references. UTBMS is not LawFirm OS canon; codes
# remain candidates until the Semantic Substrate adopts a mapping. Count-driven tasks
# carry scaling metadata (scaling_driver / hours_per_unit / expense_per_unit); the
# driver counts come from the resolved case-driver profile. When a driver is unknown the
# task falls back to its template hours. expense_code maps a fee task's expenses to a
# UTBMS E-code so the budget form's expense rows receive per-category amounts.
budget_templates:
  auto_liability_defense:
    template_id: synthetic-auto-bi-defense-utbms-v1
    code_set: UTBMS_LITIGATION
    contingency_percent: 6.0
    assumptions:
      - One synthetic motor-vehicle bodily injury claim; party and insured counts come from confirmed intake.
      - Phase and task codes follow the UTBMS litigation code set (external_code_candidate).
      - Deposition, expert, discovery, motion, and trial-day counts come from resolved case drivers.
      - Rates and hours are synthetic examples only.
    exclusions:
      - "(L500) Appeal"
      - independent adjuster or accident reconstruction vendor invoices beyond listed estimates
      - separate coverage litigation
    unknowns:
      - court-specific scheduling order
      - final deposition, medical expert, and accident reconstruction needs pending discovery
    phases:
      - phase_id: L100
        phase_name: Case Assessment, Development and Administration
        tasks:
          - task_id: L110

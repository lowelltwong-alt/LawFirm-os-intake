name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pydantic>=2.11,<3" "PyYAML>=6.0,<7" "openpyxl>=3.1,<4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/legal-intake-budget/package-lock.json
      - name: Install review UI dependencies
        working-directory: apps/legal-intake-budget
        run: npm ci
      - name: Install review UI browser
        working-directory: apps/legal-intake-budget
        run: npx playwright install --with-deps chromium
      - name: Build review UI
        working-directory: apps/legal-intake-budget
        run: npm run build
      - name: Smoke test review UI in Chromium
        working-directory: apps/legal-intake-budget
        run: npm run smoke:browser
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - run: python scripts/validate_repo.py
        timeout-minutes: 3
      - run: python scripts/validate_governance_dependency_map_mirror.py --mirror-updated true
        timeout-minutes: 3
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/export_schemas.py
        timeout-minutes: 3
      - run: python -m ruff check --no-cache src tests scripts
        timeout-minutes: 3
      - run: python -m ruff format --check --no-cache src tests scripts
        timeout-minutes: 3
      - run: python scripts/run_full_pytest.py
        timeout-minutes: 15
      - run: bash scripts/smoke_demo.sh
        timeout-minutes: 15

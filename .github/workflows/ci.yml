name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML
      - run: python scripts/validate_repo.py
        timeout-minutes: 3
      - run: python scripts/validate_governance_dependency_map_mirror.py --mirror-updated true
        timeout-minutes: 3
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/export_schemas.py
        timeout-minutes: 3
      - run: python -m ruff check --no-cache src tests scripts
        timeout-minutes: 3
      - run: python -m ruff format --check --no-cache src tests scripts
        timeout-minutes: 3
      - run: python scripts/run_full_pytest.py
        timeout-minutes: 15
      - run: bash scripts/smoke_demo.sh
        timeout-minutes: 15

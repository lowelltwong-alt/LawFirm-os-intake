reference_class_policy_id: synthetic-reference-class-bands
version: "0.1"
status: candidate
data_origin: synthetic
candidate_only: true
contains_real_firm_data: false

# SYNTHETIC ONLY. Invented reference-class feasibility bands used to sanity-check
# that a sized synthetic budget is plausible for its case type and exposure. These
# are NOT calibrated, NOT real firm/market data, and make NO real-world accuracy
# claim (section 21). They are per-case-type budget-to-exposure ratio windows plus
# an absolute minor-unit floor/ceiling. A case type with no declared band is NOT
# evaluable (fail-closed), never a silent pass.

bands:
  medical_malpractice:
    band_id: refclass-medmal-v0
    min_budget_to_exposure_ratio: 0.01
    max_budget_to_exposure_ratio: 0.60
    floor_minor_units: 200000

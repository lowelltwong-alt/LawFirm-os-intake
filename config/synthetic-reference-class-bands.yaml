reference_class_policy_id: synthetic-reference-class-bands
version: "0.2"
status: candidate
data_origin: synthetic
candidate_only: true
contains_real_firm_data: false

# SYNTHETIC ONLY. Invented reference-class feasibility bands used to sanity-check
# that a sized synthetic budget is plausible for its case type and exposure. These
# are NOT calibrated, NOT real firm/market data, and make NO real-world accuracy
# claim (section 21). Each band is a budget-to-exposure ratio window plus generous
# absolute floor/ceiling sanity bounds (in minor units) so the RATIO is the binding
# check. A case type with no declared band is NOT evaluable (fail-closed).

bands:
